{
  "openapi": "3.1.0",
  "info": {
    "title": "DualSync API",
    "version": "0.4.0",
    "description": "Private-network, same-origin API. No CORS. File paths are root-relative using forward slashes. Media index is zero-based; legacy episode control is one-based. Passwords are write-only."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/api/plex/playlists": {
      "get": {
        "operationId": "listPlexPlaylists",
        "description": "Audio playlists visible to configured Plex token.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlexPlaylists"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/plex/libraries": {
      "get": {
        "operationId": "listPlexVideoLibraries",
        "description": "Movie and show libraries visible to configured account.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlexLibraries"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/plex/videos": {
      "get": {
        "operationId": "browsePlexVideos",
        "description": "Browse a library or show/season children. Search title within that collection. next_cursor=-1 ends pagination.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlexVideos"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "library_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "parent_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200
            }
          }
        ]
      }
    },
    "/api/plex/video": {
      "get": {
        "operationId": "getPlexVideo",
        "description": "Metadata and all versions/parts. Multipart versions cannot be loaded.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlexVideoDetails"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/api/plex/video/probe": {
      "get": {
        "operationId": "probePlexVideo",
        "description": "Verified FFmpeg indices, resolved source and metadata. Cold probe can take 45 seconds; runs outside publisher clock. audio/subtitle remain unset for frontend selection.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlexVideoProbe"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "media_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "part_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "server_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/api/media/preview": {
      "post": {
        "operationId": "previewVideoSources",
        "description": "Season/folder pairing by season and episode. Missing season numbers can inherit the only explicit season. Returned title is blank so matched metadata labels loading. Missing/ambiguous entries require correction.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Preview"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VideoPreviewRequest"
              }
            }
          }
        }
      }
    },
    "/api/plex/artwork": {
      "get": {
        "operationId": "getPlexVideoArtwork",
        "description": "",
        "responses": {
          "200": {
            "description": "Plex image, up to 10 MiB. Use returned artwork URL.",
            "content": {
              "image/jpeg": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "image/png": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "kind",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "poster"
              ]
            }
          },
          {
            "name": "server_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/api/plex/playlist": {
      "get": {
        "operationId": "previewPlexPlaylist",
        "description": "Current playlist tracks; duration in seconds. file is the Plex server path, not a library-relative path.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlexTracks"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/api/status": {
      "get": {
        "operationId": "getStatus",
        "description": "Poll and discard older revisions. All times are seconds. Publishers have a separate lifetime from selected media.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Status"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/control": {
      "post": {
        "operationId": "control",
        "description": "Playback controls do not close publishers. Only stop disconnects streams.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Status"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Command"
              },
              "example": {
                "action": "seek",
                "value": 80
              }
            }
          }
        }
      }
    },
    "/api/settings": {
      "post": {
        "operationId": "updateSettings",
        "description": "Partial update. HUD, music and Plex settings can change while publishing. Destination changes require stopped streams. Blank/omitted passwords preserve stored values; status never returns passwords.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Status"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SettingsPatch"
              }
            }
          }
        }
      }
    },
    "/api/library": {
      "get": {
        "operationId": "browseLibrary",
        "description": "Search recursively within path. Results are partial during indexing; restart pagination when indexing finishes. next_cursor=-1 marks last page. Index limit 200000 entries; truncated reports limit.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Listing"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "path",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "default": ""
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "default": ""
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 100
            }
          }
        ]
      }
    },
    "/api/library/probe": {
      "get": {
        "operationId": "probeMedia",
        "description": "Cold probe takes up to 30 seconds without blocking publishing. Select absolute stream indices, not list positions.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Probe"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "path",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ]
      }
    },
    "/api/library/playlist": {
      "post": {
        "operationId": "previewPlaylist",
        "description": "Direct child files, naturally ordered. Empty dub_folder previews single-file mode; paired folders require explicit identifiers. Preview does not select media.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Preview"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PreviewRequest"
              }
            }
          }
        }
      }
    },
    "/api/media/load": {
      "post": {
        "operationId": "loadMedia",
        "description": "Asynchronous replacement, reset to zero, then Ready requiring Play. Poll media.operation; newer load/unload cancels old operation. single requires identical media references; paired accepts Plex/storage combinations. Conflicting matched identities require metadata_source.",
        "responses": {
          "202": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Status"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Load"
              },
              "example": {
                "mode": "single",
                "start_index": 0,
                "items": [
                  {
                    "title": "Episode 1",
                    "sub": {
                      "path": "Anime/Example/S01E01.mkv",
                      "audio": 1,
                      "subtitle": 3
                    },
                    "dub": {
                      "path": "Anime/Example/S01E01.mkv",
                      "audio": 2,
                      "subtitle": 4
                    }
                  }
                ]
              }
            }
          }
        }
      }
    },
    "/api/media/unload": {
      "post": {
        "operationId": "unloadMedia",
        "description": "Clear media and retain publishers; no-media scene and idle music.",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Status"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Empty"
              },
              "example": {}
            }
          }
        }
      }
    },
    "/api/diagnostics": {
      "get": {
        "operationId": "getDiagnostics",
        "description": "",
        "responses": {
          "200": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "runDiagnostics",
        "description": "Streams must be stopped. Returns running=true; poll until false. May take several minutes. Short test is not a long-term stability guarantee.",
        "responses": {
          "202": {
            "description": "Current snapshot or result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Empty"
              },
              "example": {}
            }
          }
        }
      }
    },
    "/api/music/art/{id}": {
      "get": {
        "operationId": "getMusicArtwork",
        "description": "",
        "responses": {
          "200": {
            "description": "Cached artwork; use music.cover_url verbatim.",
            "content": {
              "image/png": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ]
      }
    },
    "/api/openapi.yaml": {
      "get": {
        "operationId": "getOpenAPI",
        "description": "Also available when frontend serving is disabled.",
        "responses": {
          "200": {
            "description": "This specification",
            "content": {
              "application/yaml": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "400 invalid input; 403 origin/network/root restriction; 404 missing; 405 method; 409 state conflict; 415 content type; 422 unusable media; 500 internal; 502 publisher creation failure.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "code": {
            "type": "string",
            "enum": [
              "INVALID_JSON",
              "INVALID_CONTENT_TYPE",
              "INVALID_ARGUMENT",
              "INVALID_PATH",
              "INVALID_TRACK",
              "AMBIGUOUS_TRACK",
              "OUTSIDE_ROOT",
              "NOT_FOUND",
              "UNREADABLE",
              "PROBE_FAILED",
              "UNSUPPORTED_MEDIA",
              "CROSS_ORIGIN",
              "PRIVATE_NETWORK_REQUIRED",
              "METHOD_NOT_ALLOWED",
              "STREAMS_STOPPED",
              "STREAMS_RUNNING",
              "NO_MEDIA",
              "MEDIA_NOT_READY",
              "DESTINATIONS_REQUIRED",
              "UNSUPPORTED_HOST",
              "UNKNOWN_COMMAND",
              "BUSY",
              "PUBLISHER_FAILED",
              "INTERNAL_ERROR",
              "PLEX_FAILED",
              "AMBIGUOUS_VERSION",
              "PLEX_SERVER_CHANGED",
              "METADATA_CONFLICT"
            ]
          }
        },
        "required": [
          "error",
          "code"
        ],
        "additionalProperties": false
      },
      "Entry": {
        "type": "object",
        "properties": {
          "path": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "directory": {
            "type": "boolean"
          }
        },
        "required": [
          "path",
          "name",
          "directory"
        ],
        "additionalProperties": true
      },
      "Listing": {
        "type": "object",
        "properties": {
          "entries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Entry"
            }
          },
          "next_cursor": {
            "type": "integer",
            "minimum": -1
          },
          "indexing": {
            "type": "boolean"
          },
          "truncated": {
            "type": "boolean"
          }
        },
        "required": [
          "entries",
          "next_cursor",
          "indexing",
          "truncated"
        ],
        "additionalProperties": true
      },
      "Track": {
        "type": "object",
        "properties": {
          "index": {
            "type": "integer",
            "minimum": 0
          },
